name: Transpiler ELT
on:
  push:
    paths: ['transpiler/**', 'infra/**', 'scripts/test_transpiler_aws.py', '.github/workflows/transpiler.yml']
  pull_request:
    paths: ['transpiler/**', 'infra/**', 'scripts/test_transpiler_aws.py', '.github/workflows/transpiler.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compiler:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-only
          MYSQL_DATABASE: elt_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest-only"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install mysql-connector-python==9.1.0
      - run: python -m compileall -q transpiler
      - run: python -m unittest discover -s transpiler/tests -v
        env:
          ELT_TEST_MYSQL: '1'
      - run: python -m transpiler transpiler/examples/temperatura.elt --out gerado --explain
      - uses: actions/upload-artifact@v4
        with:
          name: elt-transpiler
          path: |
            gerado/

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.11.4'
          terraform_wrapper: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Formato dos arquivos Terraform novos
        run: terraform fmt -check -diff infra/transpiler.tf infra/modules/transpiler
      - name: Validar infraestrutura integrada (sem credenciais AWS)
        run: |
          terraform -chdir=infra init -backend=false -input=false
          terraform -chdir=infra validate
      - name: Testar modulo (AWS simulada; ZIP real)
        run: |
          terraform -chdir=infra/modules/transpiler init -backend=false -input=false
          terraform -chdir=infra/modules/transpiler test
      - name: Verificar pacote de implantacao e script de teste
        run: |
          python -m py_compile scripts/test_transpiler_aws.py
          python - <<'PY'
          import json, subprocess, sys, tempfile, zipfile
          from pathlib import Path
          package = Path("infra/modules/transpiler/elt-lambda-test.zip")
          with zipfile.ZipFile(package) as z:
              expected = {"transpiler/__init__.py", "transpiler/compiler.py",
                          "transpiler/lambda_handler.py", "transpiler/cabines.json"}
              assert set(z.namelist()) == expected, z.namelist()
              with tempfile.TemporaryDirectory() as tmp:
                  z.extractall(tmp)
                  subprocess.run([sys.executable, "-c",
                      "from transpiler.lambda_handler import REGISTRY, handler; "
                      "assert 'cabine-002' in REGISTRY; assert callable(handler)"],
                      cwd=tmp, check=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: elt-lambda-terraform
          path: infra/modules/transpiler/elt-lambda-test.zip
